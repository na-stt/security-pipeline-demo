rules:
  - id: python-unsafe-pickle
    languages: [python]
    message: Deserializing pickle data can execute code; verify the data is trusted.
    severity: WARNING
    metadata: {confidence: MEDIUM, category: security, cwe: CWE-502}
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
  - id: python-shell-command
    languages: [python]
    message: Shell invocation requires review of command input and quoting.
    severity: WARNING
    metadata: {confidence: MEDIUM, category: security, cwe: CWE-78}
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)
  - id: python-unsafe-yaml
    languages: [python]
    message: Unsafe YAML loading can construct arbitrary objects; use safe_load for untrusted data.
    severity: ERROR
    metadata: {confidence: MEDIUM, category: security, cwe: CWE-502}
    pattern-either:
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.load(..., Loader=yaml.UnsafeLoader, ...)
  - id: javascript-dynamic-evaluation
    languages: [javascript, typescript]
    message: Dynamic evaluation requires review of whether the input is attacker-controlled.
    severity: WARNING
    metadata: {confidence: MEDIUM, category: security, cwe: CWE-95}
    pattern-either:
      - pattern: eval($CODE)
      - pattern: new Function(...)
  - id: express-request-to-shell
    languages: [javascript, typescript]
    message: Request-controlled input reaches a shell command.
    severity: ERROR
    metadata: {confidence: HIGH, category: security, cwe: CWE-78}
    mode: taint
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
    pattern-sinks:
      - pattern: require('child_process').exec(...)
      - pattern: require('child_process').execSync(...)
      - patterns:
          - pattern-either:
              - pattern: $CP.exec(...)
              - pattern: $CP.execSync(...)
          - pattern-inside: |
              const $CP = require('child_process');
              ...
