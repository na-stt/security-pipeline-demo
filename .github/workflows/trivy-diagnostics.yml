name: Trivy diagnostics
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Diagnose without raw log publication
        run: |
          python3 - <<'PYTHON'
          import sys, subprocess, tempfile, os, traceback, json
          from pathlib import Path
          sys.path.insert(0, '.security/scripts')
          import scan
          normalize = scan.reports.trivy
          def diagnose_normalization(data):
              print('Result count:', len(data.get('Results', [])))
              for result in data.get('Results', []):
                  try: scan.reports.safe_path(result['Target'])
                  except Exception:
                      print('Rejected target:', json.dumps(str(result.get('Target'))[:160]))
              try: return normalize(data)
              except Exception as error:
                  print('Normalize exception:', type(error).__name__)
                  print('Frames:', [(f.name, f.lineno) for f in traceback.extract_tb(error.__traceback__)])
                  raise
          scan.reports.trivy = diagnose_normalization
          cleanup = tempfile.TemporaryDirectory.cleanup
          def diagnose_cleanup(self):
              try: return cleanup(self)
              except Exception as error:
                  print('Cleanup exception:', type(error).__name__)
                  print('Cleanup frames:', [(f.name, f.lineno) for f in traceback.extract_tb(error.__traceback__)])
                  raise
          tempfile.TemporaryDirectory.cleanup = diagnose_cleanup
          original = subprocess.run
          read_text = Path.read_text
          def inspect_read(self, *args, **kwargs):
              if self.name == 'raw.json':
                  st = self.stat()
                  print('Raw report mode/owner/reader:', oct(st.st_mode & 0o777), st.st_uid, os.getuid())
              try:
                  return read_text(self, *args, **kwargs)
              except Exception as error:
                  print('Read exception class:', type(error).__name__)
                  raise
          Path.read_text = inspect_read
          with tempfile.TemporaryFile() as log:
              def run(cmd, **kwargs):
                  if cmd[:2] == ['docker', 'run']:
                      kwargs['stderr'] = log
                  result = original(cmd, **kwargs)
                  if cmd[:2] == ['docker', 'run']:
                      print('Scanner exit code:', result.returncode)
                      log.seek(0)
                      text = log.read(2 * 1024 * 1024).decode(errors='replace').lower()
                      known = ['permission denied', 'no space left', 'read-only file system',
                          'operation not permitted', 'failed to download', 'unable to download',
                          'failed to initialize', 'download error', 'status code', 'connection refused',
                          'timeout', 'denied', 'unauthorized', 'toomanyrequests', 'manifest unknown',
                          'unknown flag', 'failed to parse', 'unable to open', 'not found',
                          'failed to load', 'unsupported', 'invalid', 'database', 'cache',
                          'forbidden', 'rate limit', 'oci', '403', '429', 'tls', 'certificate']
                      print('Recognized error categories:', [term for term in known if term in text])
                  return result
              scan.subprocess.run = run
              sys.argv = ['scan.py', '--source', '.', '--out', 'reports', '--engine', 'trivy']
              print('Adapter exit:', scan.main())
          PYTHON
