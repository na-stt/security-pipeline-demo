name: Security scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.engine }}
    # Later: JSON runner labels for an EPHEMERAL, isolated runner group.
    runs-on: ${{ fromJSON(vars.SECURITY_SCAN_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [semgrep, trivy]
    steps:
      - name: Checkout base policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout exact PR head as data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Scan without application installation or execution
        env:
          ENGINE: ${{ matrix.engine }}
        run: python3 policy/.security/scripts/scan.py --source source --out reports --engine "$ENGINE"
      - name: Preserve normalized findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.engine }}-${{ github.run_attempt }}
          path: reports/${{ matrix.engine }}.json
          if-no-files-found: warn
          retention-days: 7
