# Generated by deploy/actions/render-workflow.py. Install as .github/workflows/deepsec.yml.
name: DeepSec progress
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: deepsec-progress-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deepsec:
    name: DeepSec live progress
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      id-token: write
    steps:
      - name: Follow DeepSec review
        env:
          DEEPSEC_URL: https://sec.purepotential.ai
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          node --input-type=module <<'DEEPSEC_CLIENT'
          // Embedded in deepsec.yml by render-workflow.py; no target checkout or packages needed.
          import {appendFileSync} from 'node:fs';
          import {setTimeout as sleep} from 'node:timers/promises';
          
          async function followScan({base,sha,oidcUrl,oidcToken,summaryPath},
            {fetcher=fetch,wait=sleep,log=console.log,summary=text=>appendFileSync(summaryPath,text),now=Date.now}={}) {
            if(!/^https:\/\/[^/?#]+$/.test(base)||!/^[a-f0-9]{40}$/.test(sha)||!oidcUrl||!oidcToken) throw new Error('Missing or invalid workflow configuration');
            const requestUrl=new URL(oidcUrl);requestUrl.searchParams.set('audience',base);
            let token,tokenUntil=0;
            async function request(path,body) {
              for(let attempt=0;attempt<4;attempt++) {
                try {
                  if(now()>=tokenUntil) {
                    const response=await fetcher(requestUrl,{headers:{Authorization:`Bearer ${oidcToken}`},redirect:'error',signal:AbortSignal.timeout(20000)});
                    if(!response.ok) throw new Error('Identity unavailable');
                    const data=await response.json();
                    if(typeof data.value!=='string'||!data.value) throw new Error('Identity unavailable');
                    token=data.value;tokenUntil=now()+120000;
                  }
                  const response=await fetcher(base+path,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
                    body:body?JSON.stringify(body):undefined,redirect:'error',signal:AbortSignal.timeout(20000)});
                  if(response.status===401) {tokenUntil=0;throw new Error('Authentication failed');}
                  if(!response.ok) {
                    if(response.status>=400&&response.status<500&&response.status!==429) throw Object.assign(new Error(`Scan request rejected (HTTP ${response.status})`),{fatal:true});
                    throw new Error('Service unavailable');
                  }
                  return await response.json();
                } catch(error) {
                  if(error.fatal) throw error;
                  if(attempt===3) throw new Error('Could not reach the scan service after retries');
                  log('Connection interrupted; retrying…');await wait(5000*(attempt+1));
                }
              }
            }
            const job=await request('/actions/scans',{sha});
            if(!/^[a-f0-9-]{36}$/.test(job.id)||job.sha!==sha) throw new Error('Unexpected scan identity');
            log(`DeepSec review for commit ${sha}`);
            let cursor=0,lastState,publicationWait=0;
            const started=now();
            while(now()-started<70*60*1000) {
              const scan=await request(`/actions/scans/${job.id}?after=${cursor}`);
              if(scan.id!==job.id||scan.sha!==sha) throw new Error('Scan identity changed');
              for(const event of scan.events) {
                if(!Number.isSafeInteger(event.seq)||event.seq<=cursor) continue;
                cursor=event.seq;
                if(event.stage==='fetching') log('Fetching the PR snapshot');
                if(event.stage==='reviewing') log(`DeepSec: ${Number(event.completed)} of ${Number(event.total)} changed files reviewed`);
                if(event.stage==='reporting') log('Preparing the final report');
              }
              const elapsed=Math.floor((now()-started)/1000);
              const labels={queued:'Waiting for a worker',running:'Review in progress',complete:'Review complete',error:'Worker failed or timed out',cancelled:'Review superseded or PR no longer ready'};
              if(!Object.hasOwn(labels,scan.state)) throw new Error('Unexpected scan state');
              log(`${labels[scan.state]} · ${elapsed}s elapsed`);
              lastState=scan.state;
              if(['complete','error','cancelled'].includes(lastState)) {
                // Let the App publish the report before offering its check link.
                if(!scan.published&&publicationWait++<12) {await wait(15000);continue;}
                const passed=lastState==='complete'&&scan.conclusion==='success';
                const counts=lastState==='complete'?`${Number(scan.blocking)} blocking / ${Number(scan.findings)} total observations`:'Analysis did not complete';
                const reportUrl=typeof scan.report_url==='string'&&/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/runs\/[0-9]+$/.test(scan.report_url)?scan.report_url:null;
                const publication=scan.published?'':'\n\nThe App is still publishing its report; check Security / gate shortly.';
                summary(`## DeepSec: ${passed?'PASS':'BLOCKED'}\n\nCommit: \`${sha}\`\n\n${labels[lastState]}. ${counts}.\n\n${reportUrl?`[View Security / gate report](${reportUrl})`:'Report link unavailable.'}${publication}\n`);
                log(`${passed?'PASS':'BLOCKED'} — ${counts}`);
                return passed?0:1;
              }
              await wait(15000);
            }
            summary(`## DeepSec: timed out\n\nStopped waiting after 70 minutes. Check Security / gate for the backend result.\n`);
            throw new Error('Timed out waiting for DeepSec');
          }
          
          try {
            process.exitCode=await followScan({base:process.env.DEEPSEC_URL,sha:process.env.PR_HEAD_SHA,
              oidcUrl:process.env.ACTIONS_ID_TOKEN_REQUEST_URL,oidcToken:process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,
              summaryPath:process.env.GITHUB_STEP_SUMMARY});
          } catch(error) {
            console.error(error.message);
            process.exitCode=1;
          }
          DEEPSEC_CLIENT
